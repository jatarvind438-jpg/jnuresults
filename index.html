<!DOCTYPE html>
<html>
<head>
  <title>Examination Results</title>
  <style>
    body { font-family: Arial; background:#f4f6f8; }
    .box {
      max-width: 500px;
      margin: 60px auto;
      background: #fff;
      padding: 20px;
      border: 1px solid #ccc;
    }
    h1 { color:#003366; }
    button {
      background:#003366;
      color:white;
      border:none;
      padding:8px 16px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>Examination Results</h1>

<a href="results/BSc_Sem2_Result_2025.pdf" target="_blank">
  B.Sc. 2nd Semester Result 2025
</a>

<p style="font-size:12px;margin-top:20px;">
This website is for information purposes only.
</p>

</div>

<script>
const data = [
  {roll:"101", name:"Rahul", marks:420, status:"PASS"},
  {roll:"102", name:"Aman", marks:380, status:"FAIL"}
];

function check(){
  let r = document.getElementById("roll").value;
  let f = data.find(x => x.roll === r);
  document.getElementById("result").innerHTML =
    f ? `Name: ${f.name}<br>Marks: ${f.marks}<br>Status: ${f.status}`
      : "Result not found";
}
</script>

</body>
</html>
